# Local development and the Docker Compose end-to-end test: tokens are signed with a throwaway key pair made by
# scripts/dev-keys.sh (never committed) and minted by scripts/dev-token.sh with this issuer and audience.
loaner.auth.public-key=file:${JWT_PUBLIC_KEY_FILE:../.dev-keys/public.pem}
loaner.auth.issuer=https://dev-idp.local
loaner.auth.audience=loaner-api
