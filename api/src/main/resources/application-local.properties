# Local development and the Docker Compose end-to-end test: tokens are signed with a throwaway key pair made by
# scripts/dev-keys.sh (never committed). On AWS the "aws" profile verifies tokens with the company IdP's JWKS instead.
spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_FILE:../.dev-keys/public.pem}
