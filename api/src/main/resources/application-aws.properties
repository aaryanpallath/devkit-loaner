# DocumentDB on AWS: TLS required, retryable writes unsupported. Credentials come from Secrets Manager via ECS.
spring.mongodb.uri=mongodb://${DOCDB_USER}:${DOCDB_PASSWORD}@${DOCDB_HOST}:${DOCDB_PORT}/loaner?tls=true&retryWrites=false
# Tokens from the company identity provider (company SSO), verified with its published signing keys.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS_URI}
